name: iOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test game rules
        run: ./scripts/test.sh
      - name: Build iOS application
        run: xcodebuild -project iAnguis.xcodeproj -scheme iAnguis -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
